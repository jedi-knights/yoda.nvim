name: Badge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  badge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Install neospec
        run: |
          set -euo pipefail

          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)          ARCH="amd64" ;;
            aarch64 | arm64) ARCH="arm64" ;;
            *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
          esac

          VERSION="$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jedi-knights/neospec/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)"
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to resolve neospec version"
            exit 1
          fi

          VER="${VERSION#v}"
          ARCHIVE="neospec_${VER}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/jedi-knights/neospec/releases/download/${VERSION}/${ARCHIVE}"

          echo "Installing neospec ${VERSION} (${OS}/${ARCH})"
          curl -fsSL "$URL" | tar -xz -C "$RUNNER_TEMP" neospec
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        shell: bash

      - name: Run tests and collect coverage
        id: neospec
        run: |
          set -euo pipefail

          # The jedi-knights/neospec@v0 action only exposes `neospec run`,
          # which uses neospec's own embedded harness with no runtimepath
          # bootstrap -- it never sources tests/minimal_init.lua, so the
          # package.preload stubs for the yoda-* sibling plugins that most
          # specs need would never be set up. `cover --runner=plenary-busted`
          # instead wraps the *real* plenary.busted runner and reuses
          # tests/minimal_init.lua verbatim, matching exactly what
          # `make test` already runs in CI.
          OUTPUT_FILE="$RUNNER_TEMP/neospec_output.txt"
          PASSED=true
          if ! neospec cover --runner=plenary-busted --dir=tests/yoda \
            --minimal-init=tests/minimal_init.lua \
            --format=console --format=lcov --coverage-dir=coverage \
            2>&1 | tee "$OUTPUT_FILE"; then
            PASSED=false
          fi

          PCT="$(grep -oE 'Coverage: [0-9]+\.[0-9]+%' "$OUTPUT_FILE" \
            | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)"
          echo "coverage-percentage=${PCT:-}" >> "$GITHUB_OUTPUT"

          [ "$PASSED" = "true" ] || exit 1
        shell: bash

      - name: Generate HTML coverage report
        run: |
          sudo apt-get install -y --quiet lcov
          genhtml coverage/lcov.info -o htmlcov/ --quiet --ignore-errors source
        shell: bash

      - name: Update coverage badge
        run: |
          PCT="${{ steps.neospec.outputs.coverage-percentage }}"
          if [ -z "$PCT" ]; then
            echo "No coverage percentage output, skipping badge update"
            exit 0
          fi
          PCT_INT="${PCT%.*}"
          if [ "$PCT_INT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT_INT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT_INT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT_INT" -ge 60 ]; then COLOR="orange"
          else COLOR="red"
          fi
          URL_PCT=$(printf '%s' "$PCT" | sed 's/\./%2E/g')
          sed -i "s|img\.shields\.io/badge/Coverage-[^\"]*|img.shields.io/badge/Coverage-${URL_PCT}%25-${COLOR}|" README.md
        shell: bash

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: update coverage badge [skip ci]" && git push)
        shell: bash

      - name: Upload Pages artifact
        if: always()
        id: upload-artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: htmlcov/

      - name: Deploy to GitHub Pages
        if: always() && steps.upload-artifact.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v5
