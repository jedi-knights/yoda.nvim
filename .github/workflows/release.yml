name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      # go-semantic-release has no auto-detection from GITHUB_REPOSITORY --
      # github.owner/github.repo must come from a .semantic-release.yaml file
      # or these SEMANTIC_RELEASE_GITHUB_* env vars (viper AutomaticEnv).
      # Without them it POSTs to https://api.github.com/repos//releases
      # (empty owner/repo) and GitHub returns 404 -- publish always fails even
      # though the earlier tag-push step succeeds.
      SEMANTIC_RELEASE_GITHUB_OWNER: jedi-knights
      SEMANTIC_RELEASE_GITHUB_REPO: yoda.nvim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"

      - name: Run go-semantic-release
        uses: jedi-knights/go-semantic-release@v0.11.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
